<style>
:root{
  color-scheme: light;
  --bg:#EDEFF6; --panel:#FFFFFF; --panel-2:#F2F4FA; --track:#E3E8F1;
  --ink:#131C2E; --ink-2:#4F5E78; --ink-3:#7B89A2; --line:#DCE2EE;
  --habit:#3355F0; --habit-soft:#DEE5FF; --on-habit:#FFFFFF;
  --money:#F0A500; --money-soft:#FCEFC8; --on-money:#2A1D00;
  --train:#D12E63; --train-soft:#FADCE6; --on-train:#FFFFFF;
  --steps:#0B8576; --steps-soft:#D3F0EA; --on-steps:#FFFFFF;
  --water:#1F7AE0; --water-soft:#D8EAFE; --on-water:#FFFFFF;
  --sleep:#6A48E8; --sleep-soft:#E4DDFF; --on-sleep:#FFFFFF;
  --screen:#C95A16; --screen-soft:#FADFCC; --on-screen:#FFFFFF;
  --focus:#3355F0; --danger:#C0322F; --ok:#25946A;
  --shadow:0 1px 2px rgba(19,28,46,.05),0 18px 40px -22px rgba(19,28,46,.28);
  --glass:rgba(255,255,255,.72);
  --display:"Bricolage Grotesque","Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --text:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0B1220; --panel:#141E31; --panel-2:#1A2640; --track:#25314B;
    --ink:#EAF0FA; --ink-2:#A8B5CB; --ink-3:#7889A3; --line:#26334E;
    --habit:#8CA0FF; --habit-soft:#222C5A; --on-habit:#0B1220;
    --money:#F7C04A; --money-soft:#3B3010; --on-money:#241A00;
    --train:#FF86A8; --train-soft:#481F30; --on-train:#2A0A15;
    --steps:#4FD1BC; --steps-soft:#12403A; --on-steps:#05231F;
    --water:#6DB4FF; --water-soft:#14304F; --on-water:#04182E;
    --sleep:#A38BFF; --sleep-soft:#2B2257; --on-sleep:#150C3A;
    --screen:#FF9A5C; --screen-soft:#4A2A14; --on-screen:#2A1204;
    --focus:#8CA0FF; --danger:#FF8A84; --ok:#4FCB9B;
    --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 18px 40px -24px rgba(0,0,0,.7);
    --glass:rgba(20,30,49,.72);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0B1220; --panel:#141E31; --panel-2:#1A2640; --track:#25314B;
  --ink:#EAF0FA; --ink-2:#A8B5CB; --ink-3:#7889A3; --line:#26334E;
  --habit:#8CA0FF; --habit-soft:#222C5A; --on-habit:#0B1220;
  --money:#F7C04A; --money-soft:#3B3010; --on-money:#241A00;
  --train:#FF86A8; --train-soft:#481F30; --on-train:#2A0A15;
  --steps:#4FD1BC; --steps-soft:#12403A; --on-steps:#05231F;
  --water:#6DB4FF; --water-soft:#14304F; --on-water:#04182E;
  --sleep:#A38BFF; --sleep-soft:#2B2257; --on-sleep:#150C3A;
  --screen:#FF9A5C; --screen-soft:#4A2A14; --on-screen:#2A1204;
  --focus:#8CA0FF; --danger:#FF8A84; --ok:#4FCB9B;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 18px 40px -24px rgba(0,0,0,.7);
  --glass:rgba(20,30,49,.72);
}

*,*::before,*::after{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  position:relative;margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font:400 16px/1.5 var(--text);font-variant-numeric:tabular-nums;padding-bottom:110px;
  -webkit-tap-highlight-color:transparent;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(60vmax 42vmax at 4% -8%,color-mix(in srgb,var(--habit) 17%,transparent),transparent 62%),
    radial-gradient(52vmax 40vmax at 104% 6%,color-mix(in srgb,var(--train) 11%,transparent),transparent 62%),
    radial-gradient(60vmax 44vmax at 58% 112%,color-mix(in srgb,var(--steps) 13%,transparent),transparent 62%);
}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-0.02em;font-weight:700;line-height:1.1}
h1{font-size:clamp(32px,6.4vw,54px);font-weight:800;letter-spacing:-0.04em}
h2{font-size:19px}
h3{font-size:16px}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* domain colour wiring */
[data-d="habit"]{--c:var(--habit);--cs:var(--habit-soft);--on-c:var(--on-habit)}
[data-d="money"]{--c:var(--money);--cs:var(--money-soft);--on-c:var(--on-money)}
[data-d="train"]{--c:var(--train);--cs:var(--train-soft);--on-c:var(--on-train)}
[data-d="body"],[data-d="steps"]{--c:var(--steps);--cs:var(--steps-soft);--on-c:var(--on-steps)}
[data-d="water"]{--c:var(--water);--cs:var(--water-soft);--on-c:var(--on-water)}
[data-d="sleep"]{--c:var(--sleep);--cs:var(--sleep-soft);--on-c:var(--on-sleep)}
[data-d="screen"]{--c:var(--screen);--cs:var(--screen-soft);--on-c:var(--on-screen)}
[data-d="mood"]{--c:var(--ink);--cs:var(--panel-2);--on-c:var(--bg)}

/* ---------- shell ---------- */
.shell{max-width:1120px;margin:0 auto;padding:0 20px}
.top{display:flex;align-items:center;gap:12px;padding:18px 0 14px}
.brand{display:flex;align-items:center;gap:10px;font:800 26px/1 var(--display);letter-spacing:-0.05em}
.wm{white-space:nowrap}
.wm .trk{margin-left:.3em;font-weight:500;color:var(--ink-2)}
.mark{display:flex;align-items:flex-end;gap:3px;height:22px}
.mark i{display:block;width:6px;border-radius:3px}
.mark i:nth-child(1){height:100%;background:var(--habit)}
.mark i:nth-child(2){height:62%;background:var(--money)}
.mark i:nth-child(3){height:82%;background:var(--train)}
.mark i:nth-child(4){height:48%;background:var(--steps)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:12px}
.sync{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.sync[data-s="synced"] .dot{background:var(--ok)}
.sync[data-s="syncing"] .dot{background:var(--money)}
.sync[data-s="error"] .dot{background:var(--danger)}
.gear{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--ink)}
.gear[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.nav{display:inline-flex;gap:2px;padding:5px;margin-bottom:24px;background:var(--panel);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow)}
.nav button{display:flex;align-items:center;gap:8px;border:0;background:none;cursor:pointer;padding:9px 18px;font-weight:600;color:var(--ink-2);border-radius:999px;transition:background .15s,color .15s}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.nav .ic{display:inline-block;vertical-align:middle}

main{min-height:60vh}
.view{display:grid;gap:20px}
.hero-card{
  border-radius:34px;padding:26px;display:grid;gap:22px;border:1px solid var(--line);box-shadow:var(--shadow);
  background:linear-gradient(135deg,color-mix(in srgb,var(--habit) 11%,var(--panel)),var(--panel) 52%,color-mix(in srgb,var(--steps) 8%,var(--panel)));
}
.hero{display:grid;gap:8px}
.date{color:var(--ink-2);font-size:15px}
.lede{font:600 clamp(18px,2.6vw,24px)/1.3 var(--display);letter-spacing:-0.02em;max-width:36ch}
.page-h{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;justify-content:space-between}
.page-h .sub{color:var(--ink-2);margin-top:6px;max-width:60ch}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;transition:transform .12s,background .15s}
.btn:active{transform:scale(.97)}
.btn:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:hover{background:color-mix(in srgb,var(--ink) 86%,var(--bg))}
.btn.d{background:var(--c);border-color:var(--c);color:var(--on-c)}
.btn.d:hover{background:color-mix(in srgb,var(--c) 88%,var(--ink))}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.sm{padding:6px 13px;font-size:13px}
.btn.lg{padding:14px 26px;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.iconbtn{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--panel);cursor:pointer;color:var(--ink);flex:none}
.iconbtn:hover{border-color:var(--ink)}
.iconbtn:disabled{opacity:.35;cursor:not-allowed}
.ic{flex:none}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel-2);border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--focus)}
textarea{resize:vertical;min-height:84px}
input[type="checkbox"]{width:auto}
label,legend{font-size:13px;font-weight:600;color:var(--ink-2)}
fieldset{border:0;margin:0;padding:0;min-width:0}
.field{display:grid;gap:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.hint{font-size:13px;color:var(--ink-3)}
::placeholder{color:var(--ink-3)}
.badge{display:grid;place-items:center;width:34px;height:34px;border-radius:12px;background:var(--cs);color:var(--c);flex:none}

/* ---------- ribbon ---------- */
.ribbon-wrap{display:grid;gap:12px}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rrange{font-weight:600;color:var(--ink-2);font-size:14px}
.rnavs{display:flex;gap:8px}
.rdays{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.rday{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 10px;border:0;border-radius:22px;background:var(--panel);cursor:pointer;box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .15s}
.rday:hover{box-shadow:inset 0 0 0 2px var(--line)}
.rday.sel{box-shadow:inset 0 0 0 2.5px var(--ink)}
.rday:disabled{opacity:.4;cursor:not-allowed}
.rbars{display:flex;align-items:flex-end;gap:3px;height:76px}
.rbars i{position:relative;display:block;width:7px;height:100%;border-radius:4px;background:var(--track);overflow:hidden}
.rbars i::after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--h);background:var(--c);border-radius:4px}
.b-h{--c:var(--habit)} .b-m{--c:var(--money)} .b-t{--c:var(--train)} .b-s{--c:var(--steps)}
.rdow{font-size:12px;color:var(--ink-2);font-weight:600}
.rnum{font:700 19px/1 var(--display)}
.rday.now .rnum{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{display:block;width:10px;height:10px;border-radius:3px}
.k-h{background:var(--habit)} .k-m{background:var(--money)} .k-t{background:var(--train)} .k-s{background:var(--steps)}

/* ---------- vitals ---------- */
.vitals{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.vt{position:relative;display:grid;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:16px;box-shadow:var(--shadow);min-width:0}
.vt-main{display:grid;gap:8px;text-align:left;width:100%;border:0;background:none;padding:0;cursor:pointer;border-radius:14px}
.vt-top{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--ink-2);font-size:14px}
.vt .badge{width:30px;height:30px;border-radius:10px}
.vt-v{font:800 28px/1 var(--display);letter-spacing:-0.03em}
.vt-v.empty{font-size:20px;color:var(--ink-3);font-weight:700}
.vt-g{font-size:13px;color:var(--ink-2)}
.vt-add{justify-self:start}
.nudges{display:grid;gap:10px}
.nudge{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:12px 14px;box-shadow:var(--shadow)}
.nudge div{flex:1;min-width:0;display:grid}
.nudge b{font-weight:700}
.nudge span.s{font-size:13px;color:var(--ink-2)}

/* ---------- blocks ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.stack{display:grid;gap:20px}
.blk{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:28px;padding:20px;display:grid;gap:16px;min-width:0}
.blk-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.blk-h .meta{margin-left:auto;font-size:14px;color:var(--ink-2);font-weight:600}
.blk-h h2{flex:1;min-width:0}
.blk-h .meta + .btn,.blk-h .btn{margin-left:0}
.empty{color:var(--ink-2);font-size:15px}
.meter{height:9px;border-radius:99px;background:var(--track);overflow:hidden}
.meter i{display:block;height:100%;width:var(--w);background:var(--c);border-radius:99px}
.meter.over i{background:var(--danger)}
.note{font-size:14px;color:var(--ink-2)}
.infocard{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:22px;background:var(--panel-2);border:1px dashed var(--line);color:var(--ink-2);font-size:14px}
.infocard .ic{margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipb{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--panel-2);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;cursor:pointer}
.chipb:hover{border-color:var(--ink)}
.chipb:active{transform:scale(.97)}

.check{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;padding:10px 8px;border-radius:16px;cursor:pointer}
.check:hover{background:var(--panel-2)}
.check .box{width:28px;height:28px;flex:none;border-radius:10px;border:2px solid var(--ink-3);display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.check[aria-pressed="true"] .box{background:var(--habit);border-color:var(--habit);color:var(--on-habit)}
.check .nm{flex:1;min-width:0;font-weight:600}
.check[aria-pressed="true"] .nm{color:var(--ink-2);text-decoration:line-through;text-decoration-thickness:1.5px}
.check .st{font-size:13px;color:var(--ink-2);white-space:nowrap}

.qx{display:grid;grid-template-columns:110px 1fr auto;gap:8px}
.qx select{grid-column:2 / 4}
.qx input[name="note"]{grid-column:1 / 3}
.list{display:grid}
.tx{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;padding:11px 8px;border-radius:16px;cursor:pointer;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx:hover{background:var(--panel-2)}
.tx .m{flex:1;min-width:0;display:grid}
.tx .m b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .m small{color:var(--ink-2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .amt{font-weight:700;white-space:nowrap}
.tx .shape{color:var(--train);flex:none}
.day-h{display:flex;justify-content:space-between;padding:12px 8px 4px;font-size:13px;font-weight:700;color:var(--ink-2)}
.pips{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pip{width:24px;height:24px;border-radius:8px;border:2px solid var(--train)}
.pip.on{background:var(--train)}
.sets{font-size:13px;color:var(--ink-2)}
.mood{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mood button{border:1.5px solid var(--line);background:var(--panel-2);border-radius:14px;padding:10px 2px;font-size:13px;font-weight:600;cursor:pointer}
.mood button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* ---------- charts ---------- */
.chart{display:grid;gap:8px}
.bars{--bh:150px;position:relative;height:var(--bh);display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding-bottom:20px}
.col{position:relative;display:flex;align-items:flex-end;padding:0;border:0;background:transparent;cursor:pointer;min-width:0}
.col i{display:block;width:100%;background:var(--c);border-radius:6px 6px 2px 2px;opacity:.82;transform-origin:bottom}
.col.cur i{opacity:1}
.col.future i{background:var(--track)}
.col span{position:absolute;left:50%;bottom:-20px;transform:translateX(-50%);font-size:10.5px;color:var(--ink-3);white-space:nowrap}
.col:hover i{opacity:1}
.avgline,.goalline{position:absolute;left:0;right:0;bottom:calc(20px + (var(--bh) - 20px) * var(--p));pointer-events:none}
.avgline{border-top:1.5px dashed var(--ink-3)}
.goalline{border-top:2px solid var(--ink)}
.chart-info{min-height:20px;font-size:13px;color:var(--ink-2)}

.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,auto);grid-auto-columns:minmax(0,1fr);gap:3px}
.heat i{display:block;aspect-ratio:1;border-radius:4px;background:var(--track);min-width:0}
.heat i[data-l="n"]{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.heat i[data-l="f"]{visibility:hidden}
.heat i[data-l="1"]{background:color-mix(in srgb,var(--c) 30%,var(--track))}
.heat i[data-l="2"]{background:color-mix(in srgb,var(--c) 55%,var(--track))}
.heat i[data-l="3"]{background:color-mix(in srgb,var(--c) 78%,var(--track))}
.heat i[data-l="4"]{background:var(--c)}
.hrow{display:grid;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hrow-h{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
.hrow-h h3{font-size:18px}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:14px;color:var(--ink-2)}
.stats b{color:var(--ink);font-weight:700}

.ring{position:relative;flex:none}
.ring svg{display:block}
.rt{fill:none;stroke:var(--track);stroke-width:10}
.rf{fill:none;stroke:var(--c);stroke-width:10;stroke-linecap:round}
.ring-t{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-t b{font:800 22px/1 var(--display)}
.ring-t small{font-size:11px;color:var(--ink-2)}
.summary{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.summary .kv{display:grid;gap:2px}
.summary .kv b{font:700 22px/1.1 var(--display)}
.summary .kv span{font-size:13px;color:var(--ink-2)}
.pr{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.pr:last-child{border-bottom:0}
.pr .m{flex:1;min-width:0;display:grid}
.pr .m small{color:var(--ink-2);font-size:13px}
.spark{color:var(--train);flex:none}
.cat{display:grid;gap:6px;padding:8px 0}
.cat-h{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.cat-h span:first-child{font-weight:600}
.cat-h small{color:var(--ink-2);font-size:13px}
.toolbar{display:grid;grid-template-columns:1fr 180px;gap:10px}
.weeknav{display:flex;align-items:center;gap:10px}
.weeknav .rrange{font-size:16px;color:var(--ink)}
.rv-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;align-items:start}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.big{font:800 clamp(24px,3.4vw,34px)/1.1 var(--display);letter-spacing:-0.03em}
.delta{font-size:14px;color:var(--ink-2)}
.pat{padding:12px 0;border-bottom:1px solid var(--line);font-size:16px}
.pat:last-child{border-bottom:0}
.jr{padding:10px 0;border-bottom:1px solid var(--line);display:grid;gap:2px}
.jr:last-child{border-bottom:0}
.jr small{color:var(--ink-2);font-size:13px}
.hgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;align-items:start}
.hbig{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hbig b{font:800 clamp(30px,4vw,40px)/1 var(--display);letter-spacing:-0.04em}
.hbig span{color:var(--ink-2);font-size:14px}
.rowline{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.rowline:last-child{border-bottom:0}
.rowline small{color:var(--ink-2)}

/* start card + settings */
.startcard{position:relative;overflow:hidden;border-radius:32px;padding:26px;display:grid;gap:18px;color:#fff;background:linear-gradient(135deg,#C21F58 0%,#7A2BD6 62%,#3355F0 120%);box-shadow:0 24px 50px -26px rgba(122,43,214,.7)}
.startcard::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
.startcard h2{font-size:26px;position:relative}
.startcard p{opacity:.9;max-width:52ch;font-size:15px;position:relative}
.startcard .seg{border-color:rgba(255,255,255,.7);position:relative}
.startcard .seg button{color:#fff}
.startcard .seg button[aria-pressed="true"]{background:#fff;color:#4B1D99}
.startcard .go{background:#fff;color:#4B1D99;border-color:#fff;position:relative;justify-self:start}
.set-sec{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:28px;padding:22px;display:grid;gap:16px}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;justify-self:start}
.seg button{border:0;background:transparent;padding:8px 18px;font-weight:600;font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.cbl{display:grid;grid-template-columns:1fr 130px auto;gap:10px;align-items:center}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:6px 0}
.switch span{font-size:15px;color:var(--ink);font-weight:500}
.switch input{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:99px;background:var(--track);position:relative;cursor:pointer;border:0;padding:0;flex:none;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{transform:translateX(20px)}

/* ---------- sheets ---------- */
dialog.sheet{border:0;padding:0;background:var(--panel);color:var(--ink);border-radius:30px;width:min(580px,calc(100% - 24px));max-height:calc(100% - 40px);box-shadow:0 30px 80px rgba(8,12,24,.5)}
dialog.sheet::backdrop{background:rgba(8,12,24,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sheet-in{padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:16px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:4px}
.sheet-actions .left{margin-right:auto;display:flex;gap:10px;flex-wrap:wrap}
.daychips{display:flex;flex-wrap:wrap;gap:8px}
.daychips label{position:relative;cursor:pointer}
.daychips input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer}
.daychips span{display:block;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel-2);font-weight:600;font-size:14px;color:var(--ink)}
.daychips input:checked + span{background:var(--habit);border-color:var(--habit);color:var(--on-habit)}
.daychips input:focus-visible + span{outline:3px solid var(--focus);outline-offset:2px}
.exrow{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;align-items:start}
.exs{display:grid;gap:8px}
.arow{display:grid;grid-template-columns:1fr 110px;gap:8px}
textarea.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;min-height:200px}
.qa{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.qa button{display:flex;align-items:center;gap:12px;text-align:left;border:0;cursor:pointer;background:var(--cs);border-radius:22px;padding:14px;font-weight:700}
.qa button:active{transform:scale(.98)}
.qa .badge{background:var(--panel);width:36px;height:36px}
.shape-big{display:grid;place-items:center;padding:10px;border-radius:22px;background:var(--panel-2);color:var(--train)}

/* fab, live bar, toast */
.fab{position:fixed;right:18px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:8px;height:56px;min-width:56px;padding:0 17px;border:0;border-radius:20px;background:var(--ink);color:var(--bg);font-weight:700;cursor:pointer;justify-content:center;box-shadow:0 14px 30px -10px rgba(10,16,30,.55);transition:transform .12s}
.fab:active{transform:scale(.95)}
.fab span{display:none}
.livebar{position:fixed;left:12px;right:12px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:38;margin:0 auto;max-width:520px;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;border-radius:999px;border:0;cursor:pointer;color:#fff;background:linear-gradient(120deg,#C21F58,#7A2BD6);box-shadow:0 14px 30px -12px rgba(122,43,214,.8);font-weight:700;text-align:left}
.livebar .pulse{width:10px;height:10px;border-radius:50%;background:#fff;animation:pulse 1.4s infinite}
.livebar .lt{margin-left:auto;font:800 18px var(--display)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}100%{box-shadow:0 0 0 12px rgba(255,255,255,0)}}
.toast{position:fixed;left:12px;right:12px;margin:0 auto;width:fit-content;bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 12px 10px 18px;border-radius:999px;display:flex;align-items:center;gap:14px;font-weight:600;font-size:14px;z-index:60;max-width:calc(100% - 24px)}
.toast button{border:0;background:color-mix(in srgb,var(--bg) 22%,transparent);color:var(--bg);padding:6px 14px;border-radius:999px;font-weight:700;cursor:pointer}

/* live session */
dialog.live{border:0;padding:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;color:#fff;background:linear-gradient(165deg,#14204A 0%,#2B1740 58%,#47163A 100%)}
dialog.live::backdrop{background:#0B1020}
.live-in{min-height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:18px;padding:calc(22px + env(safe-area-inset-top,0px)) 24px calc(28px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
.live-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.live-type{font:700 20px var(--display);display:flex;align-items:center;gap:10px}
.live-min{border:1.5px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:999px;padding:8px 16px;font-weight:600;cursor:pointer}
.live-mid{display:grid;align-content:center;gap:26px;text-align:center}
.live-time{font:800 clamp(72px,22vw,120px)/1 var(--display);letter-spacing:-0.05em}
.live-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px}
.live-grid div{display:grid;gap:2px;padding:14px 6px;border-radius:22px;background:rgba(255,255,255,.1)}
.live-grid b{font:800 clamp(24px,7vw,34px)/1.05 var(--display)}
.live-grid span{font-size:12.5px;opacity:.8}
.live-note{font-size:14px;opacity:.85;min-height:42px}
.live-ctrl{display:flex;justify-content:center;gap:22px}
.live-ctrl button{display:grid;place-items:center;width:88px;height:88px;border-radius:50%;border:0;cursor:pointer;color:#14204A;background:#fff}
.live-ctrl button.stop{background:#FF5C7A;color:#fff}
.live-ctrl button:active{transform:scale(.95)}
.live-ctrl small{display:block;font-size:12px;font-weight:700;margin-top:2px}

/* ---------- enter animation (once per screen change) ---------- */
.enter .rf{animation:ringIn 1s cubic-bezier(.2,.7,.2,1) both}
.enter .col i{animation:grow .7s cubic-bezier(.2,.7,.2,1) both}
.enter .meter i{animation:meterIn .8s cubic-bezier(.2,.7,.2,1) both}
.enter .rbars i::after{animation:meterUp .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes ringIn{from{stroke-dasharray:0 400}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes meterIn{from{width:0}}
@keyframes meterUp{from{height:0}}

/* ---------- responsive ---------- */
@media (min-width:721px){
  .fab{bottom:28px;right:28px}
  .fab span{display:inline}
  .livebar{bottom:28px;left:28px;right:auto;margin:0}
  .toast{bottom:28px}
}
@media (max-width:980px){
  .vitals{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:860px){
  .grid2,.rv-grid,.three,.hgrid{grid-template-columns:1fr}
}
@media (max-width:720px){
  .shell{padding:0 16px}
  .top{padding-bottom:16px}
  .hero-card{padding:20px;border-radius:30px}
  .nav{
    position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;margin:0;
    display:flex;justify-content:space-around;padding:6px;border-radius:28px;
    background:var(--glass);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);
    box-shadow:0 14px 34px -12px rgba(10,16,30,.4);
  }
  .nav button{flex-direction:column;gap:3px;padding:7px 2px;font-size:10.5px;flex:1;min-width:0;border-radius:20px}
  .nav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
  .nav .ic{display:block}
  .sync span{display:none}
  .rday{padding:10px 2px 8px;border-radius:18px}
  .rbars{gap:2px;height:62px}
  .rbars i{width:6px}
  .rnum{font-size:16px}
  .toolbar{grid-template-columns:1fr}
  .exrow{grid-template-columns:1fr auto}
  .exrow .sets-in{grid-column:1 / 2}
  .cbl{grid-template-columns:1fr 110px auto}
  .vt{padding:14px;border-radius:24px}
  .vt-v{font-size:24px}
  .blk{padding:18px;border-radius:26px}
  dialog.sheet{margin:auto 0 0 0;width:100%;max-width:none;border-radius:30px 30px 0 0;max-height:92%}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

.has-live .fab{bottom:calc(158px + env(safe-area-inset-bottom,0px))}
.has-live .toast{bottom:calc(158px + env(safe-area-inset-bottom,0px))}
@media (min-width:721px){.has-live .fab{bottom:28px}.has-live .toast{bottom:28px}}

/* ---------- 2027 upgrades: command palette ---------- */
.cmd-trigger{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);font-size:13px;font-weight:600;cursor:pointer;transition:border-color .15s,color .15s,box-shadow .15s}
.cmd-trigger:hover{border-color:var(--ink);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.04)}
.cmd-kbd{display:inline-block;padding:2px 6px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line);font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:0.02em}
.install-pill{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;border:1.5px solid var(--habit);background:color-mix(in srgb,var(--habit) 10%,var(--panel));color:var(--habit);font-size:13px;font-weight:700;cursor:pointer;transition:background .15s,transform .1s,box-shadow .15s,color .15s}
.install-pill:hover{background:var(--habit);color:var(--on-habit);box-shadow:0 3px 12px color-mix(in srgb,var(--habit) 35%,transparent)}
.install-pill:active{transform:scale(.96)}
@media (max-width:600px){.cmd-label,.cmd-kbd{display:none}.cmd-trigger{width:38px;height:38px;padding:0;display:grid;place-items:center}.install-pill span{display:none}.install-pill{width:38px;height:38px;padding:0;display:grid;place-items:center}}

dialog.cmd-dialog{
  border:1px solid var(--line);border-radius:24px;background:var(--glass);
  backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);
  color:var(--ink);box-shadow:0 24px 60px -15px rgba(10,18,36,.35), 0 0 0 1px rgba(255,255,255,.1) inset;
  padding:0;width:92%;max-width:580px;overflow:hidden;margin:10vh auto auto auto;
}
dialog.cmd-dialog::backdrop{background:rgba(8,14,26,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.cmd-box{display:grid}
.cmd-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.cmd-input{border:0;background:none;padding:0;font-size:16px;font-weight:500;color:var(--ink);outline:none;width:100%}
.cmd-input::placeholder{color:var(--ink-3)}
.cmd-list{max-height:360px;overflow-y:auto;padding:8px;display:grid;gap:4px}
.cmd-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;border:0;background:transparent;color:var(--ink);cursor:pointer;text-align:left;width:100%;transition:background .12s}
.cmd-item:hover,.cmd-item.active{background:color-mix(in srgb,var(--habit) 14%,var(--panel-2))}
.cmd-item .cmd-title{flex:1;min-width:0;font-weight:600;font-size:14px}
.cmd-item .cmd-badge{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--track);color:var(--ink-2);font-weight:600}
.cmd-empty{padding:28px 20px;text-align:center;color:var(--ink-3);font-size:14px}

/* ---------- 2027 upgrades: veltra pulse AI card ---------- */
.pulse-card{
  border-radius:28px;padding:22px;border:1px solid var(--line);
  background:linear-gradient(135deg,color-mix(in srgb,var(--habit) 12%,var(--panel)),var(--panel) 60%,color-mix(in srgb,var(--sleep) 9%,var(--panel)));
  box-shadow:var(--shadow);display:grid;gap:14px;position:relative;overflow:hidden;
}
.pulse-card::before{
  content:"";position:absolute;top:-50px;right:-50px;width:160px;height:160px;
  background:radial-gradient(circle,color-mix(in srgb,var(--habit) 25%,transparent),transparent 70%);
  pointer-events:none;
}
.pulse-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pulse-badge{
  display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;
  letter-spacing:0.06em;text-transform:uppercase;color:var(--habit);
  background:var(--habit-soft);padding:5px 12px;border-radius:999px;
}
.pulse-dot{width:7px;height:7px;border-radius:50%;background:var(--habit);box-shadow:0 0 8px var(--habit);animation:pulse-glow 2s infinite ease-in-out}
@keyframes pulse-glow{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
.pulse-lede{font:500 15.5px/1.55 var(--text);color:var(--ink);letter-spacing:-0.01em}
.pulse-lede b{font-weight:700}
.pulse-chips{display:flex;flex-wrap:wrap;gap:8px}
.pulse-chip{
  display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;
  padding:5px 12px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-2);
}
.pulse-chip b{color:var(--ink)}

/* ---------- 2027 upgrades: life score ---------- */
.life-card{
  border-radius:28px;padding:20px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);
  display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;cursor:pointer;transition:transform .12s,box-shadow .15s;
}
.life-card:hover{transform:translateY(-1px);box-shadow:0 8px 24px -10px rgba(0,0,0,.15)}
.life-gauge{position:relative;width:94px;height:94px;flex:none}
.life-gauge svg{transform:rotate(-90deg)}
.life-gauge-t{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.life-gauge-t b{font:800 24px/1 var(--display);letter-spacing:-0.03em}
.life-gauge-t small{font-size:10px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink-3)}
.life-info{display:grid;gap:4px}
.life-title{display:flex;align-items:center;gap:8px;font:700 17px/1.2 var(--display)}
.life-status{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--cs);color:var(--c)}
.life-sub{font-size:13px;color:var(--ink-2)}
.life-bars{display:flex;gap:4px;margin-top:6px}
.life-seg{height:5px;flex:1;border-radius:99px;background:var(--track);overflow:hidden}
.life-seg i{display:block;height:100%;background:var(--c);width:var(--p, 0%);border-radius:99px}
@media (max-width:540px){.life-card{grid-template-columns:1fr;justify-items:center;text-align:center}.life-title{justify-content:center}}

/* ---------- 2027 upgrades: focus mode ---------- */
.focus-hero{
  border-radius:34px;padding:36px 24px;border:1px solid var(--line);box-shadow:var(--shadow);
  background:linear-gradient(145deg,color-mix(in srgb,var(--habit) 14%,var(--panel)),var(--panel) 55%,color-mix(in srgb,var(--sleep) 12%,var(--panel)));
  display:grid;gap:28px;place-items:center;text-align:center;
}
.focus-timer-wrap{position:relative;width:220px;height:220px;display:grid;place-items:center}
.focus-clock{position:absolute;display:grid;gap:4px;place-items:center}
.focus-clock-time{font:800 clamp(42px,8vw,56px)/1 var(--display);letter-spacing:-0.04em}
.focus-clock-label{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-2)}
.focus-presets{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.focus-ctrls{display:flex;gap:12px;align-items:center}
.focus-stats{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;font-size:14px;color:var(--ink-2)}
.focus-stats b{color:var(--ink);font-weight:700}

/* confetti burst on habit complete */
@keyframes confetti-pop{
  0%{transform:translate(0,0) scale(0);opacity:1}
  70%{opacity:1}
  100%{transform:translate(var(--tx),var(--ty)) scale(1);opacity:0}
}
.confetti-dot{position:fixed;width:7px;height:7px;border-radius:50%;pointer-events:none;z-index:9999;animation:confetti-pop .65s cubic-bezier(.25,.8,.25,1) forwards}

<script>
(() => {
'use strict';
/* ============ utilities ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseD = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const todayS = () => ymd(new Date());
const dow = s => parseD(s).getDay();
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const sum = (a, f) => a.reduce((t, x) => t + (f ? f(x) : x), 0);
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const clone = x => JSON.parse(JSON.stringify(x));
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } };

const dfLong = new Intl.DateTimeFormat(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
const dfShort = new Intl.DateTimeFormat(undefined, { day: 'numeric', month: 'short' });
const dfDow = new Intl.DateTimeFormat(undefined, { weekday: 'short' });
const dfMonth = new Intl.DateTimeFormat(undefined, { month: 'long', year: 'numeric' });
const fmtLong = s => dfLong.format(parseD(s));
const fmtShort = s => dfShort.format(parseD(s));
const fmtDow = s => dfDow.format(parseD(s));
const fmtMonth = ym => dfMonth.format(parseD(ym + '-01'));
const daysInMonth = ym => { const p = ym.split('-').map(Number); return new Date(p[0], p[1], 0).getDate(); };
const shiftMonth = (ym, n) => { const p = ym.split('-').map(Number); const d = new Date(p[0], p[1] - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };

/* ============ constants ============ */
const CURRENCIES = [['INR', '₹ Indian rupee'], ['USD', '$ US dollar'], ['EUR', '€ Euro'], ['GBP', '£ Pound sterling'], ['JPY', '¥ Japanese yen'], ['CAD', 'C$ Canadian dollar'], ['AUD', 'A$ Australian dollar'], ['SGD', 'S$ Singapore dollar'], ['AED', 'AED UAE dirham'], ['CHF', 'CHF Swiss franc']];
const DEFAULT_CATS = ['Food', 'Groceries', 'Transport', 'Bills', 'Shopping', 'Health', 'Fun', 'Other'];
const WORKOUT_TYPES = ['Strength', 'Run', 'Walk', 'Cycle', 'Swim', 'Yoga', 'Sport', 'Other'];
const DIST_TYPES = ['Run', 'Walk', 'Cycle', 'Swim'];
const MOODS = ['Rough', 'Low', 'Okay', 'Good', 'Great'];
const SUGGESTED_HABITS = ['Drink water', 'Read', 'Walk', 'Meditate', 'Stretch', 'Journal'];

function guessCurrency() {
  try {
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
    const l = navigator.language || '';
    if (/Kolkata|Calcutta/.test(tz) || /-IN$/.test(l)) return 'INR';
    if (/-GB$/.test(l)) return 'GBP';
    if (/-(DE|FR|ES|IT|NL|IE)$/.test(l)) return 'EUR';
    if (/-CA$/.test(l)) return 'CAD';
    if (/-AU$/.test(l)) return 'AUD';
  } catch (e) { /* ignore */ }
  return 'USD';
}

/* ============ state ============ */
const LS_KEY = 'tally:state:v1';
function defaultState() {
  return {
    updatedAt: 0,
    settings: { name: '', currency: guessCurrency(), weekStart: 1, weeklyGoal: 3, monthlyBudget: 0, catBudgets: {}, theme: 'auto', units: 'metric', stepsGoal: 8000, waterGoal: 2000, sleepGoal: 8, screenLimit: 240, height: 170, keepAwake: true, useMotion: true },
    cats: DEFAULT_CATS.slice(),
    habits: [],
    logs: {},
    expenses: [],
    workouts: []
  };
}
function normalize(o) {
  const base = defaultState();
  o = o || {};
  const s = base;
  s.updatedAt = Number(o.updatedAt) || 0;
  s.settings = Object.assign(base.settings, o.settings || {});
  if (!s.settings.catBudgets || typeof s.settings.catBudgets !== 'object') s.settings.catBudgets = {};
  s.settings.weekStart = Number(s.settings.weekStart) === 0 ? 0 : 1;
  s.settings.weeklyGoal = clamp(Number(s.settings.weeklyGoal) || 3, 1, 14);
  s.settings.monthlyBudget = Math.max(0, Number(s.settings.monthlyBudget) || 0);
  s.settings.stepsGoal = clamp(Math.round(Number(s.settings.stepsGoal)) || 8000, 500, 100000);
  s.settings.waterGoal = clamp(Math.round(Number(s.settings.waterGoal)) || 2000, 200, 10000);
  s.settings.sleepGoal = clamp(Number(s.settings.sleepGoal) || 8, 3, 14);
  s.settings.screenLimit = clamp(Math.round(Number(s.settings.screenLimit)) || 240, 15, 1440);
  s.settings.height = clamp(Math.round(Number(s.settings.height)) || 170, 100, 230);
  s.settings.keepAwake = s.settings.keepAwake !== false;
  s.settings.useMotion = s.settings.useMotion !== false;
  s.settings.units = s.settings.units === 'imperial' ? 'imperial' : 'metric';
  s.cats = Array.isArray(o.cats) && o.cats.length ? o.cats.filter(c => typeof c === 'string' && c) : DEFAULT_CATS.slice();
  s.habits = (Array.isArray(o.habits) ? o.habits : []).filter(h => h && h.id && h.name).map(h => {
    const x = { id: String(h.id), name: String(h.name), days: Array.isArray(h.days) && h.days.length ? h.days.map(Number) : [0, 1, 2, 3, 4, 5, 6], created: h.created || todayS(), ended: h.ended || null };
    if (h.s) x.s = 1;
    return x;
  });
  s.logs = {};
  if (o.logs && typeof o.logs === 'object') {
    for (const d in o.logs) {
      const l = o.logs[d];
      if (!l) continue;
      const x = { h: Array.isArray(l.h) ? l.h : [] };
      if (l.mood) x.mood = Number(l.mood);
      if (l.note) x.note = String(l.note);
      ['steps', 'water', 'sleep', 'sleepQ', 'screen', 'pickups'].forEach(k => { const v = Number(l[k]); if (v > 0) x[k] = v; });
      if (Array.isArray(l.apps)) {
        const ap = l.apps.filter(q => q && q.n && Number(q.min) > 0).map(q => ({ n: String(q.n).slice(0, 30), min: Number(q.min) }));
        if (ap.length) x.apps = ap;
      }
      if (l.s) x.s = 1;
      s.logs[d] = x;
    }
  }
  s.expenses = (Array.isArray(o.expenses) ? o.expenses : []).filter(e => e && typeof e.date === 'string' && isFinite(e.amt)).map(e => {
    const x = { id: String(e.id || uid()), date: e.date, amt: Number(e.amt), cat: String(e.cat || 'Other'), note: String(e.note || '') };
    if (e.s) x.s = 1;
    return x;
  });
  s.workouts = (Array.isArray(o.workouts) ? o.workouts : []).filter(w => w && typeof w.date === 'string').map(w => {
    const x = { id: String(w.id || uid()), date: w.date, type: String(w.type || 'Other'), title: String(w.title || ''), min: Number(w.min) || 0, dist: Number(w.dist) || 0, note: String(w.note || ''), ex: Array.isArray(w.ex) ? w.ex.filter(e => e && e.n).map(e => ({ n: String(e.n), sets: Array.isArray(e.sets) ? e.sets.filter(p => Array.isArray(p)).map(p => [Number(p[0]) || 0, Number(p[1]) || 0]) : [] })) : [] };
    if (Number(w.steps) > 0) x.steps = Math.round(Number(w.steps));
    if (Array.isArray(w.shape)) x.shape = w.shape.slice(0, 80).filter(p => Array.isArray(p)).map(p => [Number(p[0]) || 0, Number(p[1]) || 0]);
    if (w.src) x.src = String(w.src);
    if (w.s) x.s = 1;
    return x;
  });
  return s;
}
function loadLocal() {
  try {
    const raw = lsGet(LS_KEY);
    return raw ? normalize(JSON.parse(raw)) : null;
  } catch (e) { return null; }
}
let S = loadLocal() || defaultState();
const saveLocal = () => lsSet(LS_KEY, JSON.stringify(S));
const hasData = st => !!(st.habits.length || st.expenses.length || st.workouts.length || Object.keys(st.logs).length);

/* ============ cloud sync (private per-person storage) ============ */
let coll = null, lastSig = {}, flushing = false, pendingFlush = false, timerPending = false, flushTimer = null, retryTimer = null, remoteReady = false;
let status = 'local';
let renderHook = () => {};

function setStatus(s) {
  status = s;
  const el = $('#sync');
  if (!el) return;
  el.dataset.s = s;
  const label = { local: 'Saved on this device', syncing: 'Saving…', synced: 'Saved to your account', error: 'Sync paused, will retry' }[s];
  $('span', el).textContent = label;
  el.title = label;
}

function buildDocs(st) {
  const docs = { core: { v: 1, settings: st.settings, cats: st.cats, habits: st.habits } };
  const logs = {};
  for (const d in st.logs) { const id = 'log_' + d.slice(0, 4); (logs[id] = logs[id] || {})[d] = st.logs[d]; }
  for (const id in logs) docs[id] = { logs: logs[id] };
  const exp = {};
  for (const e of st.expenses) { const id = 'exp_' + e.date.slice(0, 4); (exp[id] = exp[id] || []).push(e); }
  for (const id in exp) docs[id] = { items: exp[id] };
  const wo = {};
  for (const w of st.workouts) { const id = 'wo_' + w.date.slice(0, 4); (wo[id] = wo[id] || []).push(w); }
  for (const id in wo) docs[id] = { items: wo[id] };
  return docs;
}
function fromDocs(docs) {
  const core = clone(docs.core || {});
  const st = { updatedAt: core.updatedAt || 0, settings: core.settings, cats: core.cats, habits: core.habits, logs: {}, expenses: [], workouts: [] };
  for (const id in docs) {
    const d = docs[id];
    if (!d || id === 'core') continue;
    if (id.indexOf('log_') === 0 && d.logs) Object.assign(st.logs, clone(d.logs));
    else if (id.indexOf('exp_') === 0 && Array.isArray(d.items)) st.expenses.push(...clone(d.items));
    else if (id.indexOf('wo_') === 0 && Array.isArray(d.items)) st.workouts.push(...clone(d.items));
  }
  return normalize(st);
}
function sigsOf(docs) {
  const out = {};
  for (const id in docs) {
    const d = clone(docs[id] || {});
    if (id === 'core') delete d.updatedAt;
    out[id] = JSON.stringify(d);
  }
  return out;
}

function scheduleFlush() {
  if (!coll) return;
  setStatus('syncing');
  timerPending = true;
  clearTimeout(flushTimer);
  flushTimer = setTimeout(() => { timerPending = false; flush(); }, 700);
}
async function flush() {
  if (!coll || !remoteReady) return;
  if (flushing) { pendingFlush = true; return; }
  flushing = true;
  try {
    do {
      pendingFlush = false;
      const at = S.updatedAt;
      const docs = buildDocs(S);
      const jobs = [];
      for (const id in docs) {
        if (id === 'core') continue;
        const sig = JSON.stringify(docs[id]);
        if (lastSig[id] !== sig) jobs.push([id, docs[id], sig]);
      }
      for (const id in lastSig) if (!(id in docs)) jobs.push([id, null, null]);
      const coreSig = JSON.stringify(docs.core);
      const needCore = jobs.length > 0 || lastSig.core !== coreSig;
      for (const j of jobs) {
        if (j[1] === null) { await coll.doc(j[0]).delete(); delete lastSig[j[0]]; }
        else { await coll.doc(j[0]).set(j[1]); lastSig[j[0]] = j[2]; }
      }
      if (needCore) {
        await coll.doc('core').set(Object.assign({}, docs.core, { updatedAt: at }));
        lastSig.core = coreSig;
      }
    } while (pendingFlush);
    if (!timerPending) setStatus('synced');
  } catch (e) {
    console.warn('Veltra Track sync failed', e);
    setStatus('error');
    clearTimeout(retryTimer);
    retryTimer = setTimeout(scheduleFlush, 15000);
  } finally {
    flushing = false;
  }
}

function adopt(docs) {
  S = fromDocs(docs);
  _ix = null;
  saveLocal();
  lastSig = sigsOf(docs);
  remoteReady = true;
  setStatus('synced');
  renderHook(true);
}
function onRemote(snap) {
  const md = snap.metadata || {};
  if (md.hasPendingWrites || md.fromCache) return;
  const docs = {};
  snap.docs.forEach(d => { docs[d.id] = d.data(); });
  const core = docs.core;
  if (!remoteReady) {
    if (!core) {
      remoteReady = true;
      if (S.updatedAt || hasData(S)) { lastSig = {}; scheduleFlush(); } else setStatus('synced');
    } else if ((core.updatedAt || 0) > S.updatedAt) {
      adopt(docs);
    } else if ((core.updatedAt || 0) < S.updatedAt) {
      remoteReady = true; lastSig = {}; scheduleFlush();
    } else {
      remoteReady = true; lastSig = sigsOf(docs); setStatus('synced');
    }
    return;
  }
  if (core && (core.updatedAt || 0) > S.updatedAt) adopt(docs);
}
async function initCloud() {
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const res = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    const db = res[0], user = res[1];
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    coll = db.collection('data/users/' + id);
    setStatus('syncing');
    coll.onSnapshot(onRemote, () => setStatus('error'));
  } catch (e) { console.warn('Veltra Track: cloud storage unavailable', e); }
}

/* ============ mutations ============ */
let _ix = null;
function commit(opts) {
  S.updatedAt = Date.now();
  _ix = null;
  saveLocal();
  scheduleFlush();
  if (!(opts && opts.quiet)) renderHook(false);
}

/* ============ formatting ============ */
const fmtCache = {};
function money(n) {
  const cur = S.settings.currency;
  const r = Math.round(n * 100) / 100;
  const whole = Number.isInteger(r);
  const key = cur + (whole ? 0 : 2);
  try {
    if (!fmtCache[key]) fmtCache[key] = new Intl.NumberFormat(cur === 'INR' ? 'en-IN' : undefined, { style: 'currency', currency: cur, minimumFractionDigits: whole ? 0 : 2, maximumFractionDigits: whole ? 0 : 2 });
    return fmtCache[key].format(r);
  } catch (e) { return cur + ' ' + r; }
}
const wUnit = () => (S.settings.units === 'imperial' ? 'lb' : 'kg');
const dUnit = () => (S.settings.units === 'imperial' ? 'mi' : 'km');
const num = n => (Math.round(n * 10) / 10).toString();
const num2 = n => (Math.round(n * 100) / 100).toString();
const nfmt = n => Math.round(n).toLocaleString();
const KM_PER_MI = 1.609344;
const distOut = km => (S.settings.units === 'imperial' ? km / KM_PER_MI : km);
const distIn = v => (S.settings.units === 'imperial' ? v * KM_PER_MI : v);
const fmtDist = km => num2(distOut(km)) + ' ' + dUnit();
const fmtDur = m => { m = Math.round(m); const h = Math.floor(m / 60), r = m % 60; return h ? (r ? h + 'h ' + r + 'm' : h + 'h') : r + 'm'; };
const ML_PER_OZ = 29.5735;
const wat = ml => (S.settings.units === 'imperial' ? num(ml / ML_PER_OZ) + ' oz' : (ml >= 1000 ? num(ml / 1000) + ' L' : Math.round(ml) + ' ml'));
const strideKm = () => S.settings.height * 0.415 / 100000;
const buzz = (ms) => { try { if (navigator.vibrate) navigator.vibrate(ms || 8); } catch (e) { /* ignore */ } };
const pct = n => Math.round(n * 100) + '%';

/* ============ dates ============ */
function weekStartOf(s) {
  const diff = (dow(s) - S.settings.weekStart + 7) % 7;
  return addDays(s, -diff);
}
function orderedDays() {
  const out = [];
  for (let i = 0; i < 7; i++) out.push((S.settings.weekStart + i) % 7);
  return out;
}
const DOW_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

/* ============ indexes ============ */
function ix() {
  if (_ix) return _ix;
  const spend = {}, exp = {}, mins = {}, wk = {}, month = {};
  for (const e of S.expenses) {
    spend[e.date] = (spend[e.date] || 0) + e.amt;
    (exp[e.date] = exp[e.date] || []).push(e);
    const m = e.date.slice(0, 7);
    month[m] = (month[m] || 0) + e.amt;
  }
  for (const w of S.workouts) {
    mins[w.date] = (mins[w.date] || 0) + (w.min || 0);
    (wk[w.date] = wk[w.date] || []).push(w);
  }
  _ix = { spend, exp, mins, wk, month };
  return _ix;
}

/* ============ habits ============ */
const isDone = (id, d) => { const l = S.logs[d]; return !!(l && l.h && l.h.indexOf(id) >= 0); };
const habitActive = (h, d) => h.created <= d && (!h.ended || d <= h.ended) && h.days.indexOf(dow(d)) >= 0;
function dayHabits(d) {
  let total = 0, done = 0;
  for (const h of S.habits) {
    if (habitActive(h, d)) { total++; if (isDone(h.id, d)) done++; }
  }
  return { total, done, pct: total ? done / total : null };
}
function streaks(h) {
  const t = todayS();
  const end = h.ended && h.ended < t ? h.ended : t;
  let best = 0, run = 0, d = h.created, guard = 0;
  while (d <= end && guard++ < 4000) {
    if (h.days.indexOf(dow(d)) >= 0) {
      if (isDone(h.id, d)) { run++; if (run > best) best = run; } else run = 0;
    }
    d = addDays(d, 1);
  }
  let cur = 0;
  d = end; guard = 0;
  if (d === t && h.days.indexOf(dow(d)) >= 0 && !isDone(h.id, d)) d = addDays(d, -1);
  while (d >= h.created && guard++ < 4000) {
    if (h.days.indexOf(dow(d)) >= 0) {
      if (isDone(h.id, d)) cur++; else break;
    }
    d = addDays(d, -1);
  }
  return { cur, best };
}
function rate(h, n) {
  const t = todayS();
  let a = 0, dn = 0;
  for (let i = 0; i < n; i++) {
    const d = addDays(t, -i);
    if (!habitActive(h, d)) continue;
    const ok = isDone(h.id, d);
    if (i === 0 && !ok) continue;
    a++; if (ok) dn++;
  }
  return a ? dn / a : null;
}
function scheduleText(h) {
  const d = h.days.slice().sort((a, b) => a - b);
  if (d.length === 7) return 'Every day';
  if (d.join() === '1,2,3,4,5') return 'Weekdays';
  if (d.join() === '0,6') return 'Weekends';
  return orderedDays().filter(x => d.indexOf(x) >= 0).map(x => DOW_NAMES[x]).join(', ');
}
function logFor(d) { return S.logs[d] || (S.logs[d] = { h: [] }); }
function cleanLog(d) {
  const l = S.logs[d];
  if (!l) return;
  const others = Object.keys(l).filter(k => k !== 'h' && k !== 's');
  if (!l.h.length && !others.length) delete S.logs[d];
}
function setLog(d, key, val) {
  const l = logFor(d);
  delete l.s;
  if (val == null || val === '' || (typeof val === 'number' && !(val > 0)) || (Array.isArray(val) && !val.length)) delete l[key];

}
function triggerConfetti(el) {

function parseSets(str) {
  const out = [];
  String(str || '').split(/[,;\n]+/).forEach(raw => {
    const tok = raw.trim().replace(/\s*(kg|lbs?)\b/gi, '');
    if (!tok) return;
    let m = tok.match(/^(\d+)\s*[x×*]\s*(\d+)\s*[x×*]\s*(\d+(?:\.\d+)?)$/i);
    if (m) { for (let i = 0; i < Math.min(+m[1], 20); i++) out.push([parseFloat(m[3]), parseInt(m[2], 10)]); return; }
    m = tok.match(/^(\d+(?:\.\d+)?)\s*[x×*]\s*(\d+)$/i);
    if (m) { out.push([parseFloat(m[1]), parseInt(m[2], 10)]); return; }
    m = tok.match(/^(\d+)$/);
    if (m) out.push([0, parseInt(m[1], 10)]);
  });
  return out;
}
const setsText = sets => sets.map(p => (p[0] ? num(p[0]) + '×' + p[1] : String(p[1]))).join(', ');
const est1RM = (w, r) => (r <= 1 ? w : w * (1 + r / 30));
function exerciseHistory() {
  const map = {};
  const list = S.workouts.slice().sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  for (const w of list) {
    for (const e of w.ex || []) {
      if (!e.sets.length) continue;
      const key = e.n.trim().toLowerCase();
      const rec = map[key] || (map[key] = { name: e.n.trim(), sessions: [], best: null });
      let top = 0, topSet = e.sets[0];
      for (const s of e.sets) {
        const v = s[0] ? est1RM(s[0], s[1]) : s[1];
        if (v > top) { top = v; topSet = s; }
      }
      rec.sessions.push({ date: w.date, v: top, set: topSet });
      if (!rec.best || top > rec.best.v) rec.best = { v: top, set: topSet, date: w.date };
    }
  }
  return Object.values(map).sort((a, b) => (a.sessions[a.sessions.length - 1].date < b.sessions[b.sessions.length - 1].date ? 1 : -1));
}
function weekWorkouts(ws) {
  const we = addDays(ws, 6);
  return S.workouts.filter(w => w.date >= ws && w.date <= we);
}

/* ============ weekly stats (review) ============ */
function weekStats(ws) {
  const days = Array.from({ length: 7 }, (_, i) => addDays(ws, i));
  const t = todayS();
  const upto = days.filter(d => d <= t);
  let hd = 0, ht = 0;
  const per = {};
  upto.forEach(d => {
    S.habits.forEach(h => {
      if (!habitActive(h, d)) return;
      ht++;
      const ok = isDone(h.id, d);
      if (ok) hd++;
      const p = per[h.id] || (per[h.id] = { h, t: 0, d: 0 });
      p.t++; if (ok) p.d++;
    });
  });
  const exps = S.expenses.filter(e => e.date >= ws && e.date <= days[6]);
  const byCat = {};
  exps.forEach(e => { byCat[e.cat] = (byCat[e.cat] || 0) + e.amt; });
  const topCat = Object.entries(byCat).sort((a, b) => b[1] - a[1])[0] || null;
  const biggest = exps.slice().sort((a, b) => b.amt - a.amt)[0] || null;
  const wks = weekWorkouts(ws);
  const moods = upto.map(d => S.logs[d] && S.logs[d].mood).filter(Boolean);
  const notes = upto.filter(d => S.logs[d] && S.logs[d].note).map(d => ({ d, note: S.logs[d].note, mood: S.logs[d].mood }));
  const avgOf = k => { const v = upto.map(d => S.logs[d] && S.logs[d][k]).filter(x => x > 0); return v.length ? sum(v) / v.length : null; };
  const body = { steps: avgOf('steps'), water: avgOf('water'), sleep: avgOf('sleep'), screen: avgOf('screen') };
  return {
    ws, days, body, hd, ht, pct: ht ? hd / ht : null, per: Object.values(per),
    spend: sum(exps, e => e.amt), topCat, biggest,
    sessions: wks.length, mins: sum(wks, w => w.min || 0), dist: sum(wks, w => w.dist || 0),
    moodAvg: moods.length ? sum(moods) / moods.length : null, notes
  };
}

/* ============ cross-domain patterns ============ */
function patterns() {
  const t = todayS(), I = ix(), out = [];
  const days = [];
  for (let i = 1; i <= 90; i++) days.push(addDays(t, -i));
  // habits on training days vs rest days
  const a = [], b = [];
  days.forEach(d => { const h = dayHabits(d); if (h.total) ((I.mins[d] || (I.wk[d] && I.wk[d].length)) ? a : b).push(h.pct); });
  if (a.length >= 6 && b.length >= 6) {
    const pa = sum(a) / a.length, pb = sum(b) / b.length;
    if (Math.abs(pa - pb) >= 0.05) out.push(`On days you train you finish ${pct(pa)} of your habits; on other days, ${pct(pb)}.`);
  }
  // mood vs habit completion
  const hi = [], lo = [];
  days.forEach(d => { const h = dayHabits(d), l = S.logs[d]; if (h.total && l && l.mood) (h.pct >= 0.8 ? hi : lo).push(l.mood); });
  if (hi.length >= 5 && lo.length >= 5) {
    const ma = sum(hi) / hi.length, mb = sum(lo) / lo.length;
    if (Math.abs(ma - mb) >= 0.25) out.push(`Your mood averages ${ma.toFixed(1)} out of 5 when you finish at least 80% of your habits, and ${mb.toFixed(1)} on other days.`);
  }
  // weekend vs weekday spending
  const we = [], wd = [];
  days.forEach(d => { const x = dow(d); (x === 0 || x === 6 ? we : wd).push(I.spend[d] || 0); });
  if (S.expenses.length >= 15 && we.length >= 8) {
    const sa = sum(we) / we.length, sb = sum(wd) / wd.length;
    if (sb > 0 && Math.abs(sa - sb) / sb >= 0.15) out.push(`You spend about ${money(Math.abs(sa - sb))} ${sa > sb ? 'more' : 'less'} per day on weekends than on weekdays.`);
  }
  // sleep and habits
  const sa = [], sb = [];
  days.forEach(d => { const l = S.logs[d], h = dayHabits(d); if (h.total && l && l.sleep) ((l.sleep >= S.settings.sleepGoal * 60 - 30) ? sa : sb).push(h.pct); });
  if (sa.length >= 6 && sb.length >= 6) {
    const pa = sum(sa) / sa.length, pb = sum(sb) / sb.length;
    if (Math.abs(pa - pb) >= 0.05) out.push(`After a full night of sleep you finish ${pct(pa)} of your habits; after a short night, ${pct(pb)}.`);
  }
  // screen time and mood
  const saScreen = [], sbScreen = [];
  days.forEach(d => { const l = S.logs[d]; if (l && l.screen && l.mood) ((l.screen <= S.settings.screenLimit) ? saScreen : sbScreen).push(l.mood); });
  if (saScreen.length >= 5 && sbScreen.length >= 5) {
    const x = sum(saScreen) / saScreen.length, y = sum(sbScreen) / sbScreen.length;
    if (Math.abs(x - y) >= 0.25) out.push(`Your mood averages ${x.toFixed(1)} out of 5 on days you stay under your screen limit, and ${y.toFixed(1)} on days you go over.`);
  }
  // steps and mood
  const ta = [], tb = [];
  days.forEach(d => { const l = S.logs[d]; if (l && l.steps && l.mood) ((l.steps >= S.settings.stepsGoal) ? ta : tb).push(l.mood); });
  if (ta.length >= 5 && tb.length >= 5) {
    const x = sum(ta) / ta.length, y = sum(tb) / tb.length;
    if (Math.abs(x - y) >= 0.25) out.push(`Your mood averages ${x.toFixed(1)} out of 5 on days you hit your step goal, and ${y.toFixed(1)} on other days.`);
  }
  return out;
}

function mStats(key) {

  const best = logged.length ? (M.lower ? Math.min(...logged.map(x => x.v)) : Math.max(...logged.map(x => x.v))) : null;
  const hits = s14.filter(x => M.hit(x.v, g)).length;

  return { g, avg, prev, best, hits, streak };
}

/* ============ 2027 intelligence: Life Score & Veltra Pulse ============ */
function calcLifeScore(d) {
  const hs = dayHabits(d);
  let hScore = hs.total ? (hs.done / hs.total) * 30 : 25;
  const l = S.logs[d] || {};
  const st = l.steps || 0;
  const mins = (ix().mins[d] || 0);
  const stepGoal = S.settings.stepsGoal || 8000;
  let mScore = 0;
  mScore += clamp(st / stepGoal, 0, 1) * 15;
  mScore += mins > 0 ? (mins >= 40 ? 10 : (mins / 40) * 10) : (st >= stepGoal ? 10 : 0);
  const sl = l.sleep || (S.logs[addDays(d, -1)] && S.logs[addDays(d, -1)].sleep) || 0;
  const sGoal = (S.settings.sleepGoal || 8) * 60;
  let sScore = sl > 0 ? clamp(sl / sGoal, 0, 1) * 20 : 12;
  const w = l.water || 0;
  const wGoal = S.settings.waterGoal || 2000;
  let wScore = w > 0 ? clamp(w / wGoal, 0, 1) * 15 : 8;
  const sc = l.screen || 0;
  const scLimit = S.settings.screenLimit || 240;
  let scScore = sc > 0 ? (sc <= scLimit ? 10 : Math.max(0, 10 - ((sc - scLimit) / 60) * 4)) : 7;
  const total = clamp(Math.round(hScore + mScore + sScore + wScore + scScore), 0, 100);
  let tier, col, badgeText, desc;
  if (total >= 88) { tier = 'Optimal'; col = '--ok'; badgeText = 'Optimal'; desc = 'Exceptional harmony across habits, movement & recovery.'; }
  else if (total >= 72) { tier = 'Thriving'; col = '--habit'; badgeText = 'Thriving'; desc = 'Strong consistency with solid momentum today.'; }
  else if (total >= 50) { tier = 'Steady'; col = '--money'; badgeText = 'Steady'; desc = 'Good baseline; a few targets need attention.'; }
  else { tier = 'Building'; col = '--train'; badgeText = 'Building'; desc = 'Room for growth; lock in one more key habit.'; }
  return { total, hScore: Math.round(hScore), mScore: Math.round(mScore), sScore: Math.round(sScore), wScore: Math.round(wScore), scScore: Math.round(scScore), tier, col, badgeText, desc };
}

function lifeScoreCard(d) {
  const ls = calcLifeScore(d);
  const r = 38, c = 2 * Math.PI * r;
  const frac = ls.total / 100;
  return `<section class="life-card" data-act="life-detail" role="button" aria-label="Life score: ${ls.total} out of 100, ${ls.tier}. Tap to view breakdown">

      </svg>
      <div class="life-gauge-t"><b>${ls.total}</b><small>Score</small></div>
    </div>
    <div class="life-info">
      <div class="life-title">
        <span>Life Score · 2027 Index</span>

      </div>
      <p class="life-sub">${esc(ls.desc)}</p>

        <span class="life-seg" title="Habits"><i style="--c:var(--habit);--p:${(ls.hScore / 30) * 100}%"></i></span>
        <span class="life-seg" title="Movement"><i style="--c:var(--steps);--p:${(ls.mScore / 25) * 100}%"></i></span>
        <span class="life-seg" title="Sleep"><i style="--c:var(--sleep);--p:${(ls.sScore / 20) * 100}%"></i></span>

function generatePulse(d) {
  const hs = dayHabits(d);
  const l = S.logs[d] || {};
  const sleep = l.sleep || (S.logs[addDays(d, -1)] && S.logs[addDays(d, -1)].sleep) || 0;
  const mins = (ix().mins[d] || 0);
  const st = l.steps || 0;
  const mb = S.settings.monthlyBudget || 0;
  const mtd = monthTotal(d.slice(0, 7));
  const dim = daysInMonth(d.slice(0, 7));
  const dayNum = parseInt(d.slice(8), 10) || 1;
  const daysLeft = Math.max(1, dim - dayNum + 1);
  const budgetRem = mb > 0 ? mb - mtd : 0;
  const dailyAllowance = budgetRem > 0 ? Math.round(budgetRem / daysLeft) : 0;

  const sentences = [];
  if (sleep >= 420) {
    sentences.push(`Recovery is primed with <b>${fmtDur(sleep)}</b> of rest.`);
  } else if (sleep > 0) {
    sentences.push(`Sleep logged at <b>${fmtDur(sleep)}</b>; prioritize an early wind-down tonight.`);
  } else {
    sentences.push(`Log your sleep to unlock full recovery insights.`);
  }

  if (hs.total > 0 && hs.done === hs.total) {
    sentences.push(`All <b>${hs.total}</b> habits completed today — streak momentum is at peak.`);
  } else if (hs.total > 0) {
    const rem = hs.total - hs.done;
    sentences.push(`<b>${rem}</b> ${rem === 1 ? 'habit' : 'habits'} left to maintain streak momentum.`);
  } else {
    sentences.push(`No habits scheduled for today.`);
  }

  if (mins > 0 || st > 0) {
    sentences.push(`Movement is on track with ${mins ? `<b>${mins} min</b> of training` : ''}${mins && st ? ' and ' : ''}${st ? `<b>${st.toLocaleString()}</b> steps` : ''}.`);
  } else if (mb > 0) {
    sentences.push(`Budget has <b>${money(budgetRem)}</b> remaining (~${money(dailyAllowance)}/day).`);
  }

  const chips = [
    sleep > 0 ? `🌙 ${fmtDur(sleep)} sleep` : null,
    hs.total > 0 ? `🎯 ${hs.done}/${hs.total} habits` : null,
    st > 0 ? `👟 ${st.toLocaleString()} steps` : (mins > 0 ? `⚡ ${mins}m active` : null),
    mb > 0 ? `💳 ${money(dailyAllowance)}/day left` : null
  ].filter(Boolean);

  return { narrative: sentences.join(' '), chips };
}

function pulseCard(d) {
  const p = generatePulse(d);
  const hr = new Date().getHours();
  const timeOfDay = hr < 12 ? 'Morning Briefing' : hr < 17 ? 'Afternoon Check-in' : 'Evening Digest';
  return `<section class="pulse-card">

/* ============ HABITS ============ */
function vHabits() {
  const t = todayS(), live_ = S.habits.filter(h => !h.ended), arch = S.habits.filter(h => h.ended);
  const weeks = 20, start = addDays(weekStartOf(t), -(weeks - 1) * 7);
  const cells = [];
  for (let i = 0; i < weeks * 7; i++) {
    const d = addDays(start, i);
    if (d > t) { cells.push(['f', '']); continue; }
    const h = dayHabits(d);
    cells.push([h.total ? (h.done === 0 ? '0' : String(Math.ceil(h.pct * 4))) : 'n', `${fmtLong(d)}: ${h.total ? h.done + ' of ' + h.total + ' habits' : 'nothing scheduled'}`]);
  }
  const row = (h, archived) => {
    const st = streaks(h), r30 = rate(h, 30);
    const st0 = addDays(weekStartOf(t), -15 * 7), hc = [];
    for (let i = 0; i < 16 * 7; i++) {
      const d = addDays(st0, i);
      if (d > t) hc.push(['f', '']);
      else if (!habitActive(h, d)) hc.push(['n', `${fmtLong(d)}: not scheduled`]);
      else hc.push([isDone(h.id, d) ? '4' : '0', `${fmtLong(d)}: ${isDone(h.id, d) ? 'done' : 'missed'}`]);
    }
    return `<article class="hrow"><div class="hrow-h"><div><h3>${esc(h.name)}</h3><p class="note">${esc(scheduleText(h))}${archived ? ', archived' : ''}</p></div><button class="btn sm" data-act="habit-edit" data-id="${esc(h.id)}">Edit</button></div>
      <div class="stats"><span><b>${st.cur}</b> in a row</span><span>Best <b>${st.best}</b></span><span>${r30 == null ? 'No data yet' : `<b>${pct(r30)}</b> of the last 30 days`}</span></div>${heat(hc)}</article>`;
  };
  return `<section class="view"><div class="page-h"><div><h1>Habits</h1><p class="sub">${live_.length ? `${live_.length} active` : 'Nothing tracked yet'}</p></div><button class="btn d" data-d="habit" data-act="habit-new">${icon('plus', 16)} New habit</button></div>
    <section class="blk" data-d="habit"><div class="blk-h">${badge('habits')}<h2>The last 20 weeks</h2></div>${heat(cells)}<p class="note">Darker squares are days when you finished more of what was scheduled. Outlined squares had nothing scheduled.</p></section>
    <section class="blk" data-d="habit"><div class="blk-h">${badge('habits')}<h2>Your habits</h2></div>${live_.length ? live_.map(h => row(h, false)).join('') : '<p class="empty">Add your first habit to see streaks and history here.</p>'}</section>
    ${arch.length ? `<section class="blk" data-d="habit"><h2>Archived</h2>${arch.map(h => row(h, true)).join('')}</section>` : ''}</section>`;
}

/* ============ MONEY ============ */
function txList(ym) {
  const q = moneyFilter.q.trim().toLowerCase();
  const list = S.expenses.filter(e => e.date.slice(0, 7) === ym && (!moneyFilter.cat || e.cat === moneyFilter.cat) && (!q || (e.note + ' ' + e.cat).toLowerCase().indexOf(q) >= 0));
  if (!list.length) return `<p class="empty">${S.expenses.length ? 'No expenses match.' : 'No expenses yet. Use Add expense to log your first one.'}</p>`;
  const by = {};
  list.forEach(e => (by[e.date] = by[e.date] || []).push(e));
  return Object.keys(by).sort().reverse().map(d => `<div class="day-h"><span>${esc(dfLong.format(parseD(d)))}</span><span>${money(sum(by[d], e => e.amt))}</span></div><div class="list">${by[d].map(txRow).join('')}</div>`).join('');
}
function vMoney() {
  const t = todayS(), ym = monthSel, curYm = t.slice(0, 7), isCur = ym === curYm, dim = daysInMonth(ym), I = ix();
  const total = monthTotal(ym), mb = S.settings.monthlyBudget;
  const elapsed = isCur ? +t.slice(8) : (ym < curYm ? dim : 0);
  const avg = elapsed ? total / elapsed : 0;
  const prevYm = shiftMonth(ym, -1);
  const prevCmp = elapsed ? sum(S.expenses.filter(e => e.date.slice(0, 7) === prevYm && +e.date.slice(8) <= elapsed), e => e.amt) : 0;
  const list = S.expenses.filter(e => e.date.slice(0, 7) === ym);
  const daily = Array.from({ length: dim }, (_, i) => {
    const d = ym + '-' + pad(i + 1), v = I.spend[d] || 0;
    return { v, label: (i === 0 || (i + 1) % 5 === 0) ? String(i + 1) : '', tip: `${fmtShort(d)}: ${v ? money(v) : 'no spending'}`, future: d > t, cur: d === t };
  });
  const byCat = {};
  list.forEach(e => { byCat[e.cat] = (byCat[e.cat] || 0) + e.amt; });
  Object.keys(S.settings.catBudgets).forEach(c => { if (S.settings.catBudgets[c] > 0 && !(c in byCat)) byCat[c] = 0; });
  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const maxCat = Math.max(1, ...cats.map(c => c[1]));
  const bits = [];
  if (elapsed && total > 0) bits.push(`<div class="kv"><b>${money(avg)}</b><span>per day on average</span></div>`);
  if (isCur && elapsed && total > 0) bits.push(`<div class="kv"><b>${money(avg * dim)}</b><span>on pace for the month</span></div>`);
  if (prevCmp > 0 && elapsed && total > 0) {
    const dlt = total - prevCmp;
    bits.push(`<div class="kv"><b>${dlt >= 0 ? '+' : '−'}${money(Math.abs(dlt))}</b><span>vs ${isCur ? 'the same point' : 'the same days'} last month</span></div>`);
  }

/* ============ REVIEW ============ */
function deltaWords(cur, prev, fmt, unit) {
  if (prev == null || cur == null) return '';
  const d = cur - prev;
  if (Math.abs(d) < 1e-9) return 'Same as the week before.';
  return `${fmt(Math.abs(d))}${unit || ''} ${d > 0 ? 'more' : 'less'} than the week before.`;
}

/* ============ 2027 FOCUS & LIFE SCORE SHEETS ============ */
let focusSec = 25 * 60;
let focusTotalSec = 25 * 60;
let focusRunning = false;
let focusTimer = null;
let focusCompletedToday = 0;
let focusMinsToday = 0;

function setFocusPreset(m) {
  focusRunning = false;
  clearInterval(focusTimer);
  focusTimer = null;
  focusTotalSec = m * 60;
  focusSec = focusTotalSec;
  render();
}

function playFocusChime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 1.2);
  } catch (e) { /* audio unavailable */ }
}

function updateFocusClock() {
  const el = $('#focusClockTime');
  const ring = $('#focusRingPath');
  if (el) el.textContent = fmtClock(focusSec);
  if (ring && focusTotalSec > 0) {
    const c = 2 * Math.PI * 90;
    const frac = clamp(focusSec / focusTotalSec, 0, 1);
    ring.setAttribute('stroke-dasharray', `${(c * frac).toFixed(1)} ${c.toFixed(1)}`);
  }
}

function toggleFocusTimer() {
  if (focusRunning) {
    focusRunning = false;
    clearInterval(focusTimer);
    focusTimer = null;
  } else {
    focusRunning = true;
    focusTimer = setInterval(() => {
      if (focusSec > 0) {
        focusSec--;
        updateFocusClock();
      } else {
        focusRunning = false;
        clearInterval(focusTimer);
        focusTimer = null;
        focusCompletedToday++;
        const finishedMins = Math.round(focusTotalSec / 60);
        focusMinsToday += finishedMins;
        playFocusChime();
        buzz(120);
        toast(`Focus block complete! (+${finishedMins} min)`);
        render();
      }
    }, 1000);
  }
  render();
}

}

function saveWorkout(form) {
  const fd = new FormData(form), id = form.dataset.id;
  const type = String(fd.get('type') || 'Other'), date = String(fd.get('date') || todayS());
  const names = fd.getAll('exn'), sets = fd.getAll('exs');
  const ex = [];
  names.forEach((n, i) => { n = String(n).trim(); if (!n) return; ex.push({ n, sets: parseSets(sets[i]) }); });
  const min = Math.max(0, Math.round(Number(fd.get('min')) || 0));
  const dist = DIST_TYPES.indexOf(type) >= 0 ? Math.max(0, distIn(Number(fd.get('dist')) || 0)) : 0;
  const steps = STEP_TYPES.indexOf(type) >= 0 ? Math.max(0, Math.round(Number(fd.get('steps')) || 0)) : 0;
  const rec = { type, date, title: String(fd.get('title') || '').trim(), min, dist, note: String(fd.get('note') || '').trim(), ex };
  if (steps) rec.steps = steps;
  if (!min && !ex.length && !rec.title && !rec.note && !dist && !steps) { toast('Add minutes, an exercise or a note.'); return; }
  if (id) {
    const w = S.workouts.find(x => x.id === id);
    if (w) { Object.assign(w, rec); if (!steps) delete w.steps; delete w.s; }
  } else {
    S.workouts.push(Object.assign({ id: uid() }, rec));
  }
  closeSheet(); commit();
}

let live = null, liveTimer = null, watchId = null, wakeLock = null, wakeOk = false, motionBound = false, liveTick = 0;

/* ============ sample data ============ */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function loadSample() {
  const rnd = mulberry32(2026), t = todayS(), N = 84;
  const scale = ({ INR: 40, JPY: 110 })[S.settings.currency] || 1;
  const mk = (name, days) => ({ id: uid(), name, days, created: addDays(t, -N), ended: null, s: 1 });
  const all = [0, 1, 2, 3, 4, 5, 6];
  const hs = [mk('Drink 2 litres of water', all), mk('Read 20 pages', all), mk('Walk 30 minutes', [1, 2, 3, 4, 5]), mk('Stretch', all)];
  S.habits.push(...hs);
  const notes = ['Slow start, better by afternoon.', 'Long day, kept it simple.', 'Good focus today.', 'Tired but showed up.', 'Felt strong in the gym.', 'A quiet evening walk helped.'];
  const catSpec = [['Food', 4, 14], ['Groceries', 12, 40], ['Transport', 3, 12], ['Bills', 10, 45], ['Shopping', 8, 60], ['Health', 6, 30], ['Fun', 8, 35]];
  const round = v => { const r = Math.round(v * scale); return scale > 1 ? Math.round(r / 5) * 5 : Math.round(v); };
  const lifts = [['Squat', 50], ['Bench Press', 35], ['Barbell Row', 35]];
  for (let i = N; i >= 0; i--) {
    const d = addDays(t, -i), prog = 1 - i / N, p = 0.5 + 0.35 * prog;
    const done = [];
    hs.forEach(h => { if (h.days.indexOf(dow(d)) >= 0 && (i > 0 || rnd() < 0.4) && rnd() < p) done.push(h.id); });
    const log = { h: done, s: 1 };
    if (i > 0 || rnd() < 0.5) { log.mood = Math.min(5, 2 + Math.floor(rnd() * 4)); }
    if (rnd() < 0.18) log.note = notes[Math.floor(rnd() * notes.length)];
    log.steps = i === 0 ? 2400 + Math.floor(rnd() * 1500) : Math.round((4200 + rnd() * 6200) * (0.85 + 0.25 * prog) / 100) * 100;
    log.water = i === 0 ? 500 : (3 + Math.floor(rnd() * 7)) * 250;
    log.sleep = Math.round((360 + rnd() * 150) / 5) * 5;
    if (rnd() < 0.8) log.sleepQ = 2 + Math.floor(rnd() * 4);
    if (i > 0) {
      const sc = Math.round((340 - 110 * prog + rnd() * 100 - 50) / 5) * 5;
      log.screen = sc; log.pickups = 40 + Math.floor(rnd() * 60);
      log.apps = [['Instagram', 0.34], ['YouTube', 0.24], ['WhatsApp', 0.16], ['Chrome', 0.1]].map(a => ({ n: a[0], min: Math.max(5, Math.round(sc * a[1] * (0.8 + rnd() * 0.4) / 5) * 5) }));
    }
    S.logs[d] = log;
    const n = rnd() < 0.2 ? 0 : rnd() < 0.65 ? 1 : 2;
    for (let k = 0; k < n; k++) {
      const c = catSpec[Math.floor(rnd() * catSpec.length)];
      S.expenses.push({ id: uid(), date: d, amt: round(c[1] + rnd() * (c[2] - c[1])), cat: c[0], note: '', s: 1 });
    }
    const wd = dow(d), wkIdx = Math.floor((N - i) / 7);
    if (i > 0 && (wd === 1 || wd === 4) && rnd() < 0.85) {
      const bump = Math.round(wkIdx / 3) * 2.5;
      S.workouts.push({ id: uid(), date: d, type: 'Strength', title: wd === 1 ? 'Lower body' : 'Upper body', min: 45 + Math.floor(rnd() * 20), dist: 0, note: '', s: 1, ex: lifts.map(l => { const w = l[1] + bump; return { n: l[0], sets: [[w, 8], [w, 8], [w + 2.5, 6]] }; }) });
    } else if (i > 0 && wd === 6 && rnd() < 0.8) {
      const dk = Math.round((3 + rnd() * 3) * 10) / 10;
      S.workouts.push({ id: uid(), date: d, type: 'Run', title: '', min: 25 + Math.floor(rnd() * 20), dist: dk, steps: Math.round(dk * 1280), note: '', s: 1, ex: [] });
    } else if (i > 0 && wd === 3 && rnd() < 0.5) {
      S.workouts.push({ id: uid(), date: d, type: 'Yoga', title: '', min: 30, dist: 0, note: '', s: 1, ex: [] });
    }
  }
  if (S.settings.monthlyBudget === 0) S.settings.monthlyBudget = round(900);
  commit();
}
function removeSample() {
  const gone = new Set(S.habits.filter(h => h.s).map(h => h.id));
  S.habits = S.habits.filter(h => !h.s);
  S.expenses = S.expenses.filter(e => !e.s);
  S.workouts = S.workouts.filter(w => !w.s);
  for (const d in S.logs) {
    const l = S.logs[d];

async function exportFile(filename, text) {

    if (dl) { await dl.save({ filename, data: text }); toast('Export ready.'); return; }
  } catch (e) {
    if (e && e.code === 'declined') return;
    console.warn(e);
  }
  try {
    const mime = filename.endsWith('.json') ? 'application/json' : 'text/csv;charset=utf-8;';
    const blob = new Blob([text], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('Downloaded ' + filename);
    return;
  } catch (e) {
    console.warn('Browser download fallback', e);
  }
  openSheet(`${sheetHead(filename)}<p class="note">Copy this text and keep it somewhere safe.</p><textarea class="code" readonly id="exp-text">${esc(text)}</textarea><div class="sheet-actions"><button type="button" class="btn" data-act="close-sheet">Done</button></div>`);
  const ta = $('#exp-text'); if (ta) { ta.focus(); ta.select(); }
}

document.addEventListener('keydown', e => {

    openCmd();
    return;
  }
  const cmd = $('#cmd');
  if (cmd && cmd.open) {
    const list = filteredCmds();
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (list.length) { cmdActiveIdx = (cmdActiveIdx + 1) % list.length; renderCmdDialog(); }
      return;
    }
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (list.length) { cmdActiveIdx = (cmdActiveIdx - 1 + list.length) % list.length; renderCmdDialog(); }
      return;
    }
    if (e.key === 'Enter') {
      e.preventDefault();
      if (list.length && list[cmdActiveIdx]) list[cmdActiveIdx].act();
      return;
    }
    if (e.key === 'Escape') {
      closeCmd();
      return;
    }
  }
  if (e.key === 'Enter' && e.target.id === 'newcat') { e.preventDefault(); ACTIONS['cat-add'](); }
});
sheet().addEventListener('click', e => { if (e.target === sheet()) closeSheet(); });
$('#cmd').addEventListener('click', e => { if (e.target === $('#cmd')) closeCmd(); });
$('#live').addEventListener('cancel', e => e.preventDefault());

/* ============ init ============ */
applyTheme();
setStatus('local');
$('#gear').innerHTML = icon('settings', 20);
$('#fab').innerHTML = icon('plus', 24, 2.6) + '<span>Quick add</span>';
render();
if (lsGet(LIVE_KEY) && !live) { /* a nudge on Today offers to resume */ }
initCloud();

/* ============ PWA & Offline Support ============ */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  const pill = $('#installPill');
  if (pill) {
    pill.classList.add('can-install');
    pill.title = 'Install Veltra Track to your home screen or desktop';
  }
});
window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  toast('Veltra Track installed as an app!');
});

if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration error:', err));
  });
}
})();
</script>
</body>
</html>
